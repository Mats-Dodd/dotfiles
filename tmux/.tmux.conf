# Initialize TMUX plugin manager (keep this line at the very bottom)
# run '~/.tmux/plugins/tpm/tpm'

# ═══════════════════════════════════════════════════════════════════
# macOS SPECIFIC NOTES
# ═══════════════════════════════════════════════════════════════════
#
# Install tmux on macOS:
# brew install tmux
#
# For clipboard integration, install reattach-to-user-namespace:
# brew install reattach-to-user-namespace
#
# If using iTerm2, enable "Applications in terminal may access clipboard"
# in Preferences > General > Selection