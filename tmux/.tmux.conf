# ~/.tmux.conf - Quality of Life tmux Configuration (macOS Optimized)

# ═══════════════════════════════════════════════════════════════════
# PREFIX KEY & BASIC SETTINGS
# ═══════════════════════════════════════════════════════════════════

# Change prefix to Ctrl-Space (much easier to press!)
unbind C-b
set-option -g prefix C-Space
bind-key C-Space send-prefix

# Enable mouse support (click to select panes, drag to resize, scroll)
set -g mouse on

# Set default terminal mode for better color support on Mac
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# macOS clipboard integration
set -g default-command "reattach-to-user-namespace -l $SHELL"

# Increase scrollback buffer size
set -g history-limit 10000

# Start windows and panes at 1, not 0 (easier on keyboard)
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows automatically when one is closed
set -g renumber-windows on

# ═══════════════════════════════════════════════════════════════════
# KEY BINDINGS
# ═══════════════════════════════════════════════════════════════════

# Reload tmux config with prefix + r
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Better pane splitting (more intuitive)
bind | split-window -h -c "#{pane_current_path}"  # Vertical split with |
bind - split-window -v -c "#{pane_current_path}"  # Horizontal split with -
unbind '"'
unbind %

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vim-style pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Quick window navigation
bind -n M-h previous-window  # Alt+h
bind -n M-l next-window      # Alt+l

# Quick session switching
bind -r ( switch-client -p
bind -r ) switch-client -n

# ═══════════════════════════════════════════════════════════════════
# COPY MODE IMPROVEMENTS (macOS Optimized)
# ═══════════════════════════════════════════════════════════════════

# Use vim keybindings in copy mode
setw -g mode-keys vi

# Enter copy mode with prefix + v
bind v copy-mode

# Vim-style copy/paste with macOS clipboard integration
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "reattach-to-user-namespace pbcopy"
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle

# Paste from macOS clipboard
bind p run "reattach-to-user-namespace pbpaste | tmux load-buffer - && tmux paste-buffer"

# Double click to select word and copy to clipboard
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "reattach-to-user-namespace pbcopy"

# ═══════════════════════════════════════════════════════════════════
# VISUAL & STATUS BAR
# ═══════════════════════════════════════════════════════════════════

# Colors for pane borders
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour39

# Status bar design
set -g status-justify left
set -g status-bg colour234
set -g status-fg colour137
set -g status-interval 2

# Status bar left side
set -g status-left '#[fg=colour233,bg=colour39,bold] #S #[fg=colour39,bg=colour234,nobold]'
set -g status-left-length 20

# Status bar right side
set -g status-right '#[fg=colour233,bg=colour241,bold] %d/%m #[fg=colour233,bg=colour245,bold] %H:%M:%S '
set -g status-right-length 50

# Window status
setw -g window-status-current-format ' #I#[fg=colour250]:#[fg=colour255]#W#[fg=colour39]#F '
setw -g window-status-format ' #I#[fg=colour237]:#[fg=colour250]#W#[fg=colour244]#F '

# Activity monitoring
setw -g monitor-activity on
set -g visual-activity off

# ═══════════════════════════════════════════════════════════════════
# PERFORMANCE & BEHAVIOR
# ═══════════════════════════════════════════════════════════════════

# Reduce escape time for faster key response
set -sg escape-time 1

# Increase repeat time for repeatable commands
set -g repeat-time 1000

# Enable focus events for vim compatibility
set -g focus-events on

# Don't exit tmux when closing a session
set -g detach-on-destroy off

# ═══════════════════════════════════════════════════════════════════
# USEFUL ALIASES/SHORTCUTS
# ═══════════════════════════════════════════════════════════════════

# Quick pane synchronization toggle
bind S setw synchronize-panes

# Clear screen and history
bind C-l send-keys 'C-l' \; clear-history

# Kill session shortcut
bind X confirm-before -p "kill-session #S? (y/n)" kill-session

# New window with current path
bind c new-window -c "#{pane_current_path}"

# ═══════════════════════════════════════════════════════════════════
# PLUGINS (Optional - uncomment if you want to use)
# ═══════════════════════════════════════════════════════════════════

# To use plugins, install TPM first:
