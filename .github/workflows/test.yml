name: test

on:
  push:
  pull_request:

jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck zsh
          mkdir -p "$HOME/.local/bin"
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
      - name: Check repository scripts
        run: |
          bash -n install.sh scripts/*.sh
          shellcheck install.sh scripts/*.sh
      - name: Render Ubuntu templates
        run: |
          chezmoi execute-template < home/run_onchange_before_install-packages.sh.tmpl > /tmp/install-packages.sh
          chezmoi execute-template < home/run_onchange_after_install-tools.sh.tmpl > /tmp/install-tools.sh
          chezmoi execute-template < home/dot_zshrc.tmpl > /tmp/zshrc
          chezmoi execute-template < home/dot_zprofile.tmpl > /tmp/zprofile
          chezmoi execute-template < home/dot_gitconfig.tmpl > /tmp/gitconfig
          bash -n /tmp/install-packages.sh /tmp/install-tools.sh
          shellcheck /tmp/install-packages.sh /tmp/install-tools.sh
          zsh -n /tmp/zshrc /tmp/zprofile
          git config --file /tmp/gitconfig --list >/dev/null
      - name: Validate Ubuntu target set
        run: |
          destination="$(mktemp -d)"
          chezmoi --source="$PWD" --destination="$destination" apply --dry-run >/dev/null
          chezmoi --source="$PWD" --destination="$destination" managed > /tmp/managed
          grep -q '^.config/Code/User/settings.json$' /tmp/managed
          grep -q '^.config/Cursor/User/settings.json$' /tmp/managed
          ! grep -q '^.config/aerospace' /tmp/managed
          ! grep -q '^Library/' /tmp/managed
